name: Daily reminder

on:
  schedule:
    - cron: "30 0 * * *" # UTC 00:30 = 北京时间 08:30（GitHub 定时可能延迟 0–30 分钟）
  workflow_dispatch:

permissions: {}

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 拉取今日任务并推送提醒
        env:
          SUPABASE_URL: https://axwaaxojosmujcdkcrhc.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TODO_EMAIL: ${{ secrets.TODO_EMAIL }}
          TODO_PASSWORD: ${{ secrets.TODO_PASSWORD }}
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/daily-reminder.mjs
