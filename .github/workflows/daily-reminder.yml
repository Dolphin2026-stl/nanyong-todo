name: Daily reminder

on:
  schedule:
    - cron: "45 23 * * *" # 北京时间 07:45
  workflow_dispatch:

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Print test reminder
        run: |
          echo "【日期 农历 节日/历史纪念日】"
          echo "天气概况：待接入天气数据"
          echo "核心目标（今日截止）：待接入项目任务"
          echo ""
          echo "近期待办：（3-5条）待接入项目任务"
          echo ""
          echo "今日论文推荐：待接入论文来源"
